[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --basetemp=data/pytest_tmp
cache_dir = data/pytest_cache
markers =
    unit: Hermetic in-memory unit tests with zero external dependencies
    async_safe: In-memory async coroutine tests that do not allocate OS loopback sockets
    loopback: Tests requiring real loopback TCP/UDP sockets or local network servers
    ipc: Tests requiring inter-process communication pipes or named sockets
    external_network: Tests requiring external internet or DNS resolution
    browser_integration: Tests spawning real Chromium / Playwright browser processes
    windows_integration: Tests requiring Win32 UIA, desktop handles, or Job Objects
    hardware: Tests requiring physical GPU (CUDA), neural ONNX models, or audio hardware
    slow: Tests taking more than 5 seconds
filterwarnings =
    ignore::DeprecationWarning
    ignore::ResourceWarning
    ignore::PendingDeprecationWarning
